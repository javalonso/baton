<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baton — Record button</title>
<style>
/* Baton design tokens.
 * Every color pair used for text is verified at 4.5:1 or better; every interactive
 * boundary at 3:1 or better. See docs/design-principles.md.
 */

:root {
  /* Surfaces */
  --bg: #F6F8F5;
  --surface: #FFFFFF;
  --surface-sunken: #EEF2EC;

  /* Borders. `border` is decorative; `border-strong` is for interactive boundaries (3:1). */
  --border: #D9E0D8;
  --border-strong: #7F8C82;

  /* Text */
  --text: #141A16;        /* 17.7:1 on surface */
  --text-muted: #4C5A51;  /* 7.3:1 on surface */

  /* Sage — primary action, calm states */
  --sage: #2F6B4F;        /* 6.3:1 on surface */
  --sage-hover: #255741;
  --sage-soft: #E3EDE6;
  --on-sage: #FFFFFF;     /* 6.3:1 on sage */

  /* Amber — attention, not alarm */
  --amber: #8A5A05;       /* 5.9:1 on surface, for text */
  --amber-fill: #F0A63C;  /* fill only; pair with --text at 8.6:1 */
  --amber-soft: #FCF0DC;

  /* Urgent — the scarcest resource in the system. One thing at a time. */
  --urgent: #A3231C;      /* 7.5:1 on surface */
  --urgent-soft: #FBE9E7;
  --on-urgent: #FFFFFF;   /* 7.5:1 on urgent */

  /* Type scale */
  --font-sans: "Söhne", "Inter Tight", ui-sans-serif, system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --size-xs: 0.8125rem;   /* 13px — metadata only */
  --size-sm: 0.9375rem;   /* 15px — portal secondary */
  --size-md: 1.0625rem;   /* 17px — portal body */
  --size-lg: 1.125rem;    /* 18px — volunteer app body, the floor in the field */
  --size-xl: 1.375rem;    /* 22px */
  --size-2xl: 1.75rem;    /* 28px */
  --leading-tight: 1.25;
  --leading-body: 1.55;

  /* Spacing — 4px base */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-12: 3rem;

  /* Radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;

  /* Targets — above the WCAG floor on purpose. See docs/design-principles.md. */
  --target-field: 56px;   /* volunteer app, one-handed, outdoors */
  --target-portal: 44px;

  /* Motion — structural only */
  --dur-fast: 120ms;
  --dur: 200ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);

  --shadow-card: 0 1px 2px rgba(20, 26, 22, 0.06), 0 1px 3px rgba(20, 26, 22, 0.04);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111512;
    --surface: #1A201C;
    --surface-sunken: #0C100D;
    --border: #2E362F;
    --border-strong: #74837A;
    --text: #E9EFE9;
    --text-muted: #A3B0A6;
    --sage: #7CC49A;
    --sage-hover: #94D3AC;
    --sage-soft: #1E2C24;
    --on-sage: #111512;
    --amber: #F0B25C;
    --amber-fill: #B77A18;
    --amber-soft: #2A2115;
    --urgent: #F2938C;
    --urgent-soft: #2C1917;
    --on-urgent: #111512;
    --shadow-card: none;
  }
}

:root[data-theme="dark"] {
  --bg: #111512;
  --surface: #1A201C;
  --surface-sunken: #0C100D;
  --border: #2E362F;
  --border-strong: #74837A;
  --text: #E9EFE9;
  --text-muted: #A3B0A6;
  --sage: #7CC49A;
  --sage-hover: #94D3AC;
  --sage-soft: #1E2C24;
  --on-sage: #111512;
  --amber: #F0B25C;
  --amber-fill: #B77A18;
  --amber-soft: #2A2115;
  --urgent: #F2938C;
  --urgent-soft: #2C1917;
  --on-urgent: #111512;
  --shadow-card: none;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 1ms;
    --dur: 1ms;
  }
}


* { box-sizing: border-box; }
body {
  margin: 0;
  padding: var(--space-8);
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--size-md);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
}
h1 { font-size: var(--size-xl); line-height: var(--leading-tight); margin: 0 0 var(--space-2); }
.hint { color: var(--text-muted); font-size: var(--size-sm); margin: 0 0 var(--space-6); max-width: 62ch; }
.row { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: flex-start; }
.stack { display: flex; flex-direction: column; gap: var(--space-4); }
.label { font-size: var(--size-xs); color: var(--text-muted); text-transform: uppercase;
         letter-spacing: 0.06em; margin-bottom: var(--space-2); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card); padding: var(--space-4); }


.rec { display: flex; align-items: center; gap: var(--space-3); min-height: 96px;
       padding: 0 var(--space-8); border: 0; border-radius: var(--radius-pill);
       background: var(--sage); color: var(--on-sage); font-family: var(--font-sans);
       font-size: var(--size-lg); font-weight: 600; cursor: pointer;
       transition: background var(--dur) var(--ease); }
.rec:hover { background: var(--sage-hover); }
.rec:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
.rec.is-live { background: var(--urgent); color: var(--on-urgent); }
.rec.is-busy { background: var(--surface-sunken); color: var(--text-muted);
               border: 2px solid var(--border-strong); cursor: default; }
.dot { width: 20px; height: 20px; border-radius: 50%; background: currentColor; flex: none; }
.bars { display: flex; align-items: center; gap: 3px; height: 24px; }
.bars i { width: 4px; border-radius: 2px; background: currentColor; animation: vu 900ms var(--ease) infinite alternate; }
.bars i:nth-child(1) { height: 10px; animation-delay: 0ms; }
.bars i:nth-child(2) { height: 20px; animation-delay: 120ms; }
.bars i:nth-child(3) { height: 14px; animation-delay: 240ms; }
.bars i:nth-child(4) { height: 22px; animation-delay: 360ms; }
.bars i:nth-child(5) { height: 12px; animation-delay: 480ms; }
@keyframes vu { to { transform: scaleY(0.45); } }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--border);
        border-top-color: var(--text-muted); animation: sp 900ms linear infinite; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .bars i, .spin { animation: none; }
}

</style>
</head>
<body>
<h1>Record button</h1>
<p class="hint">The single gesture the whole product rests on. One primary action, 96px, reachable with a thumb. The recording state shows real elapsed time, and the processing state describes what the agent is actually doing — never a spinner on a fixed timer.</p>

<div class="row">
  <div><div class="label">Idle</div>
    <button class="rec">
      <span class="dot"></span>
      <span class="rec-label">Record visit note</span>
    </button></div>

  <div><div class="label">Recording</div>
    <button class="rec is-live">
      <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="rec-label">0:24 — tap to stop</span>
    </button></div>

  <div><div class="label">Processing</div>
    <button class="rec is-busy" disabled>
      <span class="spin"></span>
      <span class="rec-label">Listening to what you said…</span>
    </button></div>
</div>

</body>
</html>
