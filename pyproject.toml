[project]
name = "baton"
version = "0.1.0"
description = "An AI agent that carries the memory of a community care network"
requires-python = ">=3.11"
dependencies = [
    "strands-agents",
    "strands-agents-tools",
    "fastapi",
    "mangum",
    "pydantic",
    "boto3",
    "reportlab",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "uvicorn"]

[tool.ruff]
line-length = 100
target-version = "py311"
